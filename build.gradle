plugins {
    id 'java'
    id "io.qameta.allure" version "2.12.0"
}

repositories {
    mavenCentral()
}

/**
 * Версии лучше держать в одном месте (проще поддерживать)
 */
ext {
    allureVersion = "2.27.0"
    selenideVersion = "7.2.3"
    junitVersion = "5.10.2"
    aspectjVersion = "1.9.24"
}

dependencies {

    testImplementation (
            "com.codeborne:selenide:${selenideVersion}",
            "org.junit.jupiter:junit-jupiter:${junitVersion}",
            "com.github.javafaker:javafaker:1.0.2",

            "io.qameta.allure:allure-junit5:${allureVersion}",
            "io.qameta.allure:allure-selenide:${allureVersion}",

            "org.aspectj:aspectjweaver:${aspectjVersion}"
    )
}

/**
 * СТАБИЛЬНЫЙ AspectJ (важно для GitHub Actions)
 */
configurations {
    aspectj
}

dependencies {
    aspectj "org.aspectj:aspectjweaver:${aspectjVersion}"
}

/**
 * Основной task для тестов
 */
test {
    useJUnitPlatform()

    // чтобы CI мог передавать параметры (selenoid / remote)
    systemProperty "selenide.remote", System.getProperty("selenide.remote")

    // стабильный AspectJ agent
    jvmArgs "-javaagent:${configurations.aspectj.singleFile}"

    // Allure результаты всегда сюда
    systemProperty "allure.results.directory", "build/allure-results"
}

/**
 * Отдельный запуск по тегам (как у тебя в уроке)
 */
task simple_tests(type: Test) {
    useJUnitPlatform {
        includeTags("simple")
    }

    systemProperty "selenide.remote", System.getProperty("selenide.remote")
    systemProperty "allure.results.directory", "build/allure-results"

    jvmArgs "-javaagent:${configurations.aspectj.singleFile}"
}
